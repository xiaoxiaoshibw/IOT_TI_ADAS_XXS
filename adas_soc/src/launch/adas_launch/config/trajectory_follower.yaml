# 轨迹跟踪（横向 PurePursuit + 纵向 PID）
/**:
  ros__parameters:
    rate_hz: 50.0
    trajectory_timeout_s: 0.3
    odom_timeout_s: 0.15
    lateral_controller_mode: pure_pursuit
    longitudinal_controller_mode: pid
    pure_pursuit:
      wheelbase_m: 2.7
      # 历史保留：run() 已不再使用，新公式见 adaptive.*。
      lookahead_gain_s: 0.8
      min_lookahead_m: 3.0
      max_lookahead_m: 20.0
      max_steer_rad: 0.6
      # Commit 4 — 自适应前视：base × curve_factor 让高速直道保持 ~12 m、
      # 紧弯压到 7-9 m。验收稳定后再评估 curve_gain/curve_factor_min。
      adaptive:
        base_speed_coeff: 0.7
        base_speed_offset_m: 2.0
        curve_gain: 4.0
        curve_factor_min: 0.6
        max_lookahead_high_m: 12.0
    pid:
      # Commit 6c — 收敛性更紧的 PID：kp 0.8, ki 0.15, preview 0.6
      kp: 0.8
      ki: 0.15
      kd: 0.0
      integral_limit: 2.0
      max_accel_mps2: 3.0
      max_decel_mps2: 4.0
      stop_speed_mps: 0.5
      start_speed_mps: 0.8
      stop_hold_accel_mps2: -1.5
      preview_time_s: 0.6
      # Commit 6b — 积分冻结带；|error| < 此值跳过积分累加
      integrator_freeze_band_mps: 0.5

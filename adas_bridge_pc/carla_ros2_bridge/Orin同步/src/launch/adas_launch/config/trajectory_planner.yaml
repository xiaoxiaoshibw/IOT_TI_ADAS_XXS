# 轨迹规划
/**:
  ros__parameters:
    rate_hz: 20.0
    input_timeout_s: 0.3
    global_route.enabled: true
    global_route.goal_stop_distance_m: 1.5
    # Commit 2 — global-route ACC params (mirror of SoC yaml).
    global_route.lead_time_gap_s: 1.4
    global_route.lead_standstill_m: 4.0
    lateral_avoidance_enabled: false
    horizon_s: 8.0
    min_length_m: 30.0
    max_length_m: 120.0
    step_m: 1.0
    cruise_speed_mps: 15.0
    max_lat_accel_mps2: 2.0
    # Commit 3 — mirror of SoC yaml.
    global_route.curvature_envelope_m: 12.0
    max_accel_mps2: 1.5
    max_decel_mps2: 2.0
    follow_time_gap_s: 1.1
    follow_standstill_m: 4.0

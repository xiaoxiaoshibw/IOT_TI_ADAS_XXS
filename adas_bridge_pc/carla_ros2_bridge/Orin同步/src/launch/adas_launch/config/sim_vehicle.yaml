# 仿真车辆：M1 基准场景（300m 直道 + R=100m 左弯 200m + 300m 直道）
sim_vehicle:
  ros__parameters:
    rate_hz: 50.0
    vehicle:
      wheelbase_m: 2.7
      max_steer_rad: 0.6
      max_accel_mps2: 3.0
      max_decel_mps2: 8.0
      steer_tau_s: 0.2
      drag_accel_mps2: 0.1
    track:
      segment_lengths_m: [300.0, 200.0, 300.0]
      segment_curvatures: [0.0, 0.01, 0.0]
      lane_width_m: 3.5
    initial:
      station_m: 0.0
      lateral_offset_m: 0.3   # 起步带偏移，检验收敛
      speed_mps: 0.0
